{% extends "base.html" %}
{% block title %}Cadastrar esporte{% endblock %}

{% block content %}
<section class="card form-card">
    <h2>Cadastrar esporte</h2>

    <form method="POST">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" maxlength="40" required>

        <label for="modalidade">Modalidade</label>
        <input id="modalidade" name="modalidade" maxlength="80" required>

        <label for="categoria">Categoria</label>
        <input id="categoria" name="categoria" maxlength="40">

        <label for="federacao">Federação</label>
        <input id="federacao" name="federacao" maxlength="80">

        <label for="olimpico">Olímpico</label>
        <select id="olimpico" name="olimpico" required>
            <option value="False">Não</option>
            <option value="True">Sim</option>
        </select>

        <label for="expoente">Expoente</label>
        <input id="expoente" name="expoente" maxlength="40">

        <div class="form-actions">
            <a class="btn secondary" href="{{ url_for('home') }}">Cancelar</a>
            <button class="btn" type="submit">Cadastrar</button>
        </div>
    </form>
</section>
{% endblock %}
